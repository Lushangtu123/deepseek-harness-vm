- id: ui-theme
  config:
    preference: light
- id: ui-settings-account
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: dsh-purge
  config:
    executionMode: vm-autonomous

# Imported host web plugins; systemd owns restarts.
- id: dsh-market
  config:
    profile: web
    allowRestart: false
